<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hours and Minutes Converter</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        flex-direction: column;
      }

      .converter {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        width: 300px;
        text-align: center;
        margin-bottom: 20px;
      }

      .converter h1 {
        font-size: 20px;
        color: black;
        margin-bottom: 20px;
      }

      .converter form {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .converter label {
        width: 100%;
        margin-bottom: 8px;
        font-weight: bold;
        color: black;
      }

      .converter input {
        width: calc(100%);
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid black;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .converter button {
        width: 100%;
        padding: 10px;
        background-color: rgb(50, 149, 255);
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .converter button:hover {
        background-color: rgb(0, 105, 218);
      }

      .result {
        margin-top: 20px;
        font-size: 16px;
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="converter">
      <h1>Hours and Minutes Converter</h1>
      <form id="hoursToMinutesForm">
        <label for="hours">Enter number of hours:</label>
        <input type="number" id="hours" name="hours" placeholder="e.g. 2" />
        <button type="button" id="convertHoursToMinutesButton">
          Convert to minutes
        </button>
      </form>

      <form id="minutesToHoursForm">
        <label for="minutes">Enter number of minutes:</label>
        <input
          type="number"
          id="minutes"
          name="minutes"
          placeholder="e.g. 120"
        />
        <button type="button" id="convertMinutesToHoursButton">
          Convert to hours
        </button>
      </form>

      <div class="result" id="result"></div>
    </div>

    <script>
      $(document).ready(function () {
        const displayResult = (message) => {
          $("#result").text(message);
        };

        const convertHoursToMinutes = () => {
          const hoursInput = $("#hours").val();
          const hours = parseFloat(hoursInput);

          if (isNaN(hours) || hours < 0) {
            displayResult("Please enter a valid number of hours.");
            return;
          }

          const minutes = hours * 60;
          displayResult(`${hours} hours is equal to ${minutes} minutes.`);
        };

        const convertMinutesToHours = () => {
          const minutesInput = $("#minutes").val();
          const minutes = parseFloat(minutesInput);

          if (isNaN(minutes) || minutes < 0) {
            displayResult("Please enter a valid number of minutes.");
            return;
          }

          const hours = (minutes / 60).toFixed(2);
          displayResult(`${minutes} minutes is equal to ${hours} hours.`);
        };

        $("#convertHoursToMinutesButton").click(convertHoursToMinutes);
        $("#convertMinutesToHoursButton").click(convertMinutesToHours);
      });
    </script>
  </body>
</html>
