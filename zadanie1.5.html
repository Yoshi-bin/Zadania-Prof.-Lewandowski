<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sum Numbers</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <label for="numbersInput">Enter numbers separated by commas:</label>
    <input type="text" id="numbersInput" placeholder="e.g. 1,2,3,4" />
    <button id="calculateSum">Result</button>
    <div id="result"></div>

    <script>
      const sumNumbers = (...numbers) => {
        return numbers.reduce((total, num) => total + num, 0);
      };

      $(document).ready(() => {
        $("#calculateSum").click(() => {
          const inputValues = $("#numbersInput").val();
          const numbers = inputValues.split(",").map(Number);
          const result = sumNumbers(...numbers);
          $("#result").text(`The total is: ${result}`);
        });
      });
    </script>
  </body>
</html>
