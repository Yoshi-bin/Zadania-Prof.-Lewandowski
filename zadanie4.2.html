<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadratic Equation Solver</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
        text-align: center;
      }
      h1 {
        font-size: 1.5em;
        margin-bottom: 20px;
      }
      input {
        width: 90%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background-color: rgb(50, 149, 255);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
      }
      button:hover {
        background-color: rgb(0, 105, 218);
      }
      .result {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Quadratic Solver</h1>
      <form id="quadratic-form">
        <input type="number" id="a" placeholder="Enter a" required />
        <input type="number" id="b" placeholder="Enter b" required />
        <input type="number" id="c" placeholder="Enter c" required />
        <button type="button" id="solve">Solve</button>
      </form>
      <div class="result" id="result"></div>
    </div>

    <script>
      $(document).ready(function () {
        $("#solve").click(function () {
          const a = parseFloat($("#a").val());
          const b = parseFloat($("#b").val());
          const c = parseFloat($("#c").val());

          if (isNaN(a) || isNaN(b) || isNaN(c)) {
            $("#result").text("Please enter valid numbers for a, b, and c.");
            return;
          }

          const delta = Math.pow(b, 2) - 4 * a * c;
          let resultText = "";

          if (delta > 0) {
            const x1 = (-b + Math.sqrt(delta)) / (2 * a);
            const x2 = (-b - Math.sqrt(delta)) / (2 * a);
            resultText = `Two roots: x₁ = ${x1.toFixed(2)}, x₂ = ${x2.toFixed(
              2
            )}`;
          } else if (delta === 0) {
            const x = -b / (2 * a);
            resultText = `One root: x = ${x.toFixed(2)}`;
          } else {
            resultText = "No real roots (delta < 0).";
          }

          $("#result").text(resultText);
        });
      });
    </script>
  </body>
</html>
