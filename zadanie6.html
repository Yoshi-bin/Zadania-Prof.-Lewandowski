<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotto Game Simulation</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: white;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .lotto-container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        width: 400px;
      }

      .lotto-container h1 {
        font-size: 24px;
        margin-bottom: 10px;
        text-align: center;
      }

      .lotto-container form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .lotto-container form input[type="number"] {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 4px;
        width: calc(100% - 20px);
        margin: 0 auto;
      }

      .lotto-container button {
        background-color: rgb(50, 149, 255);
        color: white;
        padding: 10px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .lotto-container button:hover {
        background-color: rgb(0, 105, 218);
      }

      .result {
        margin-top: 20px;
        padding: 10px;
        background-color: white;
        border: 1px solid rgb(0, 105, 218);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="lotto-container">
      <h1>Lotto Game Simulation</h1>
      <form id="lottoForm">
        <input type="number" placeholder="Number 1" min="1" max="49" required />
        <input type="number" placeholder="Number 2" min="1" max="49" required />
        <input type="number" placeholder="Number 3" min="1" max="49" required />
        <input type="number" placeholder="Number 4" min="1" max="49" required />
        <input type="number" placeholder="Number 5" min="1" max="49" required />
        <input type="number" placeholder="Number 6" min="1" max="49" required />
        <button type="submit">Play</button>
      </form>
      <div id="result" class="result" style="display: none"></div>
    </div>

    <script>
      $(document).ready(function () {
        $("#lottoForm").on("submit", function (event) {
          event.preventDefault();

          const userNumbers = [
            ...new Set(
              $(this)
                .find('input[type="number"]')
                .map(function () {
                  return parseInt($(this).val(), 10);
                })
                .get()
                .filter((num) => !isNaN(num) && num >= 1 && num <= 49)
            ),
          ];

          if (userNumbers.length !== 6) {
            $("#result")
              .show()
              .html("Please enter exactly 6 unique numbers between 1 and 49.");
            return;
          }

          const generateRandomNumbers = () => {
            const numbers = new Set();
            while (numbers.size < 6) {
              numbers.add(Math.floor(Math.random() * 49) + 1);
            }
            return Array.from(numbers);
          };

          const lottoNumbers = generateRandomNumbers();
          const matchedNumbers = userNumbers.filter((num) =>
            lottoNumbers.includes(num)
          );

          $("#result").show().html(`
                    <p>Your numbers: ${userNumbers.join(", ")}</p>
                    <p>Drawn numbers: ${lottoNumbers.join(", ")}</p>
                    <p>Matched numbers: ${
                      matchedNumbers.join(", ") || "None"
                    }</p>
                    <p>Your result: ${matchedNumbers.length} match(es)</p>
                    <p>${getPrizeMessage(matchedNumbers.length)}</p>
                `);
        });

        const getPrizeMessage = (matches) => {
          switch (matches) {
            case 6:
              return "Congratulations! You won the jackpot!";
            case 5:
              return "You won the second prize!";
            case 4:
              return "You won the third prize!";
            case 3:
              return "You won a consolation prize!";
            default:
              return "Sorry, no win this time. Try again!";
          }
        };
      });
    </script>
  </body>
</html>
