<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Fee Calculator</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 400px;
        margin: auto;
        padding: 20px;
        background: #fff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 16px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: rgb(50, 149, 255);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: rgb(0, 105, 218);
      }

      .result {
        margin-top: 20px;
        padding: 10px;
        background-color: white;
        border-radius: 4px;
        font-size: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Fee Calculator</h1>
      <form id="account-form">
        <label for="account-balance">Account Balance (PLN):</label>
        <input
          type="number"
          id="account-balance"
          name="accountBalance"
          step="0.01"
          value="5000.0"
          required
        />
        <button type="submit">Calculate Fee</button>
      </form>
      <div class="result" id="result"></div>
    </div>

    <script>
      $(document).ready(() => {
        $("#account-form").on("submit", (event) => {
          event.preventDefault();

          const balanceInput = $("#account-balance").val();
          const balance = parseFloat(balanceInput);

          if (isNaN(balance) || balance < 0) {
            $("#result").text("Please provide a valid balance.");
            return;
          }

          const fee = calculateFee(balance);
          $("#result").text(
            `The account maintenance fee is: ${fee.toFixed(2)} PLN`
          );
        });

        const calculateFee = (balance) => balance * 0.1;
      });
    </script>
  </body>
</html>
