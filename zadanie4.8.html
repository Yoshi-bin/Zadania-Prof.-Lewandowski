<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Form</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .employee-form {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 400px;
      }

      .employee-form h2 {
        text-align: center;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group input {
        width: calc(100% - 16px);
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        display: block;
        margin: 0 auto;
      }

      .form-group button {
        width: 100%;
        padding: 10px;
        background-color: rgb(50, 149, 255);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      .form-group button:hover {
        background-color: rgb(0, 105, 218);
      }

      .employee-list {
        margin-top: 20px;
      }

      .employee-list h3 {
        color: rgb(50, 149, 255);
      }

      .employee-item {
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #f7f7f7;
      }
    </style>
  </head>
  <body>
    <div class="employee-form">
      <h2>Add Employee</h2>
      <form id="employeeForm">
        <div class="form-group">
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="position">Position:</label>
          <input type="text" id="position" name="position" required />
        </div>
        <div class="form-group">
          <label for="salary">Salary (PLN):</label>
          <input type="number" id="salary" name="salary" required />
        </div>
        <div class="form-group">
          <button type="submit">Add Employee</button>
        </div>
      </form>
      <div class="employee-list" id="employeeList">
        <h3>Employee List</h3>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        class Employee {
          constructor(name, position, salary) {
            this.name = name;
            this.position = position;
            this.salary = salary;
          }

          toHTML() {
            return `
                        <div class="employee-item">
                            <p><strong>Full Name:</strong> ${this.name}</p>
                            <p><strong>Position:</strong> ${this.position}</p>
                            <p><strong>Salary:</strong> ${this.salary} PLN</p>
                        </div>
                    `;
          }
        }

        const employees = [];

        $("#employeeForm").on("submit", function (e) {
          e.preventDefault();

          const name = $("#name").val();
          const position = $("#position").val();
          const salary = parseFloat($("#salary").val());

          const newEmployee = new Employee(name, position, salary);

          employees.push(newEmployee);

          $("#employeeList").append(newEmployee.toHTML());

          $("#employeeForm")[0].reset();
        });
      });
    </script>
  </body>
</html>
