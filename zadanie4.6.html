<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Income Tax Calculator</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f8ff;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .tax-calculator {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 350px;
      }

      .tax-calculator h2 {
        text-align: center;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group input {
        width: calc(100% - 16px);
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        display: block;
        margin: 0 auto;
      }

      .form-group button {
        width: 100%;
        padding: 10px;
        background-color: rgb(50, 149, 255);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      .form-group button:hover {
        background-color: rgb(0, 105, 218);
      }

      .result {
        margin-top: 15px;
        text-align: center;
        font-size: 18px;
        color: #28a745;
      }
    </style>
  </head>
  <body>
    <div class="tax-calculator">
      <h2>Tax Calculator</h2>
      <form id="taxForm">
        <div class="form-group">
          <label for="income">Income (PLN):</label>
          <input type="number" id="income" name="income" required />
        </div>
        <div class="form-group">
          <button type="submit">Calculate Tax</button>
        </div>
      </form>
      <div class="result" id="result"></div>
    </div>

    <script>
      $(document).ready(function () {
        $("#taxForm").on("submit", function (e) {
          e.preventDefault();

          const income = parseFloat($("#income").val());
          let tax;

          if (income <= 120000) {
            tax = income * 0.17;
          } else {
            const baseTax = 120000 * 0.17;
            const higherTax = (income - 120000) * 0.32;
            tax = baseTax + higherTax;
          }

          $("#result").text(`Total Tax Due: ${tax.toFixed(2)} PLN`);
        });
      });
    </script>
  </body>
</html>
