<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arithmetic Calculator</title>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .calculator {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        width: 300px;
      }

      .calculator h2 {
        text-align: center;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group input,
      .form-group select {
        width: calc(100% - 16px);
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        display: block;
        margin: 0 auto;
      }

      .form-group button {
        width: 100%;
        padding: 10px;
        background-color: rgb(50, 149, 255);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      .form-group button:hover {
        background-color: rgb(0, 105, 218);
      }

      .result {
        margin-top: 15px;
        text-align: center;
        font-size: 18px;
        color: rgb(0, 105, 218);
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <h2>Calculator</h2>
      <form id="calcForm">
        <div class="form-group">
          <label for="value1">First Value:</label>
          <input type="number" id="value1" name="value1" required />
        </div>
        <div class="form-group">
          <label for="operation">Operation:</label>
          <select id="operation" name="operation" required>
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="value2">Second Value:</label>
          <input type="number" id="value2" name="value2" required />
        </div>
        <div class="form-group">
          <button type="submit">Calculate</button>
        </div>
      </form>
      <div class="result" id="result"></div>
    </div>

    <script>
      $(document).ready(function () {
        $("#calcForm").on("submit", function (e) {
          e.preventDefault();

          const value1 = parseFloat($("#value1").val());
          const value2 = parseFloat($("#value2").val());
          const operation = $("#operation").val();
          let result;

          switch (operation) {
            case "+":
              result = value1 + value2;
              break;
            case "-":
              result = value1 - value2;
              break;
            case "*":
              result = value1 * value2;
              break;
            case "/":
              if (value2 !== 0) {
                result = value1 / value2;
              } else {
                result = "Error: Division by zero";
              }
              break;
            default:
              result = "Unknown operation";
          }

          $("#result").text(`Result: ${result}`);
        });
      });
    </script>
  </body>
</html>
